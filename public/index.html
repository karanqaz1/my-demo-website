
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORM SUBMISION</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
  background-size: 300% 300%;
  animation: gradient 10s ease infinite;
  font-family: Inter, Arial, sans-serif;
  color: #172033;
  padding: 22px;
}

@keyframes gradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.card {
  width: min(100%, 430px);
  background: rgba(255,255,255,.96);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 25px;
  padding: 30px;
  box-shadow: 0 25px 70px #24104c45;
  backdrop-filter: blur(15px);
  animation: appear .7s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.badge {
  display: inline-block;
  background: linear-gradient(120deg,#e0e7ff,#f3e8ff);
  color: #6841c6;
  border-radius: 99px;
  padding: 8px 13px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .06em;
}

h1 {
  font-size: 25px;
  margin: 18px 0 8px;
  color: #29205a;
}

.sub {
  color: #687386;
  font-size: 14px;
  line-height: 1.55;
  margin: 0 0 24px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin: 15px 0 7px;
  color: #39345c;
}

input {
  width: 100%;
  padding: 14px;
  border: 1.5px solid #e0dafa;
  border-radius: 12px;
  font-size: 15px;
  outline: none;
  background: #faf9ff;
  transition: .3s;
}

input:focus {
  border-color: #8056df;
  background: white;
  box-shadow: 0 0 0 4px #8056df20;
}

.consent {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  color: #687386;
  font-size: 12px;
  line-height: 1.45;
  margin: 19px 0;
}

.consent input {
  width: auto;
  margin-top: 2px;
  accent-color: #7545d5;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  background: linear-gradient(110deg,#5268e8,#9047d5,#d34cba);
  color: white;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 20px #7545d545;
  transition: .3s;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px #7545d560;
}

button:active {
  transform: scale(.98);
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.note {
  font-size: 11px;
  color: #85809a;
  text-align: center;
  margin: 17px 0 0;
}

#status {
  font-size: 13px;
  line-height: 1.5;
  margin-top: 15px;
}

.success {
  color: #137a48;
}

.error {
  color: #b42318;
}

@media(max-width:480px) {
  .card {
    padding: 25px 21px;
  }

  h1 {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<main class="card">

  <span class="badge">REGISTRATION FORM</span>

  <h1>Fill your contact details</h1>

  <p class="sub">
    All details must be match with your Adhar Card
  </p>

  <form id="form">

    <label for="name">Full name</label>
    <input id="name" name="name" autocomplete="name"
    maxlength="80" required placeholder="Your name">

    <label for="mobile">Mobile number</label>
    <input id="mobile" name="mobile" autocomplete="tel"
    inputmode="tel" maxlength="20" required
    placeholder="+91 98765 43210">

    <label for="email">Email address</label>
    <input id="email" name="email" type="email"
    autocomplete="email" maxlength="120" required
    placeholder="you@example.com">

    <label class="consent">
      <input id="consent" type="checkbox" required>
      <span>I agree that all details are correctly filled by me.</span>
    </label>

    <button id="submit" type="submit">
      Submit details
    </button>

    <div id="status" role="status" aria-live="polite"></div>

  </form>

  <p class="note">
    Attention — Your details are safe. only use for credentials purpose.
  </p>

</main>

</body>
</html>

<script>
const form = document.getElementById("form");
const statusBox = document.getElementById("status");
const button = document.getElementById("submit");
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  statusBox.className = "";
  statusBox.textContent = "Submitting…";
  button.disabled = true;
  try {
    const response = await fetch("/api/submit", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        name: document.getElementById("name").value,
        mobile: document.getElementById("mobile").value,
        email: document.getElementById("email").value,
        consent: document.getElementById("consent").checked
      })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Submission failed.");
    statusBox.className = "success";
    statusBox.textContent = result.notification === "sent"
      ? "Submitted successfully. thank you!"
      : "Submitted successfully. Telegram is not connected yet; add bot credentials on the server to enable notifications.";
    form.reset();
  } catch (error) {
    statusBox.className = "error";
    statusBox.textContent = error.message || "Something went wrong.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
